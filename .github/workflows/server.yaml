name: Deploy to EC2 (feature/test Branch)

on:
  push:
    branches:
      - feature/test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            echo "---- Pulling latest changes ----" &&
            cd ~/doctor-management-backend || cd /home/$USER/doctor-management-backend &&
            git fetch origin feature/test &&
            git reset --hard origin/feature/test &&
            
            echo "---- Installing dependencies ----" &&
            npm install --production &&
            
            echo "---- Restarting server ----" &&
            export PATH=$PATH:/usr/local/bin:~/.npm-global/bin &&
            pm2 restart feature-test || pm2 start ecosystem.config.js --only feature-test &&
            
            echo "---- Deployment Completed Successfully ----"
          '
